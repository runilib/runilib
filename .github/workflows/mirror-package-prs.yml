name: Mirror Package PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - closed
    branches:
      - main
    paths:
      - 'packages/**'
      - '.github/mirror-packages.json'
      - '.github/workflows/mirror-package-prs.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Monorepo pull request number to mirror
        required: true
        type: number

concurrency:
  group: mirror-package-prs-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare Mirror PR Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_packages: ${{ steps.matrix.outputs.has_packages }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      pr_title: ${{ steps.pr.outputs.pr_title }}
      pr_body: ${{ steps.pr.outputs.pr_body }}
      pr_merged: ${{ steps.pr.outputs.pr_merged }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::Missing pull request number."
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          pr_state="$(echo "$pr_json" | jq -r '.state')"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$pr_state" != "open" ]; then
            echo "::error::Pull request #${PR_NUMBER} is not open (state=${pr_state})."
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(echo "$pr_json" | jq -r '.base.sha')" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$pr_json" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
          echo "pr_merged=$(echo "$pr_json" | jq -r '.merged')" >> "$GITHUB_OUTPUT"
          {
            echo "pr_title<<__EOF__"
            echo "$pr_json" | jq -r '.title'
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "pr_body<<__EOF__"
            echo "$pr_json" | jq -r '.body // ""'
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build mirror matrix
        id: matrix
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail

          config_file=".github/mirror-packages.json"
          empty_matrix='{"include":[]}'

          if [ ! -f "$config_file" ]; then
            echo "matrix=${empty_matrix}" >> "$GITHUB_OUTPUT"
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "pull/${PR_NUMBER}/head:mirror-pr-head"

          changed_json="$(git diff --name-only "$BASE_SHA" mirror-pr-head | jq -R -s 'split("\n") | map(select(length > 0))')"

          if echo "$changed_json" | jq -e '
            any(.[]; . == ".github/mirror-packages.json" or . == ".github/workflows/mirror-package-prs.yml")
          ' > /dev/null; then
            matrix="$(jq -c '{include: .packages}' "$config_file")"
          else
            matrix="$(jq -c --argjson changed "$changed_json" '
              {
                include: [
                  .packages[] as $pkg
                  | select(any($changed[]; . == $pkg.package_path or startswith($pkg.package_path + "/")))
                  | $pkg
                ]
              }
            ' "$config_file")"
          fi

          if [ "$(echo "$matrix" | jq '.include | length')" -gt 0 ]; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mirror-open-update:
    name: Mirror PR for ${{ matrix.workspace }}
    needs: prepare
    if: needs.prepare.outputs.has_packages == 'true' && !(github.event_name == 'pull_request_target' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        env:
          SECRET_GIT_USER_NAME: ${{ secrets.MIRROR_GIT_USER_NAME }}
          SECRET_GIT_USER_EMAIL: ${{ secrets.MIRROR_GIT_USER_EMAIL }}
        run: |
          git config user.name "${SECRET_GIT_USER_NAME:-runilib-bot}"
          git config user.email "${SECRET_GIT_USER_EMAIL:-bot@runilib.dev}"

      - name: Create subtree branch from source PR
        id: subtree
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PACKAGE_PATH: ${{ matrix.package_path }}
        run: |
          set -euo pipefail

          git fetch origin "pull/${PR_NUMBER}/head:mirror-pr-head"

          if ! git cat-file -e "mirror-pr-head:${PACKAGE_PATH}" 2>/dev/null; then
            echo "Package path ${PACKAGE_PATH} does not exist in PR head. Skipping."
            echo "has_branch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git subtree split --prefix="${PACKAGE_PATH}" mirror-pr-head -b mirror-pr-branch
          echo "has_branch=true" >> "$GITHUB_OUTPUT"

      - name: Push subtree branch to mirror repository
        if: steps.subtree.outputs.has_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          TARGET_REPO: ${{ matrix.target_repo }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_PUSH_TOKEN:-}" ]; then
            echo "::error::MIRROR_PUSH_TOKEN secret is empty."
            exit 1
          fi

          viewer_permission="$(gh repo view "$TARGET_REPO" --json viewerPermission --jq '.viewerPermission' 2>/dev/null || true)"

          if [ -z "$viewer_permission" ] || [ "$viewer_permission" = "READ" ] || [ "$viewer_permission" = "TRIAGE" ]; then
            echo "::error::MIRROR_PUSH_TOKEN cannot write to ${TARGET_REPO} (viewerPermission=${viewer_permission:-unknown})."
            echo "::error::Use a PAT or GitHub App installation token with at least contents:write and pull-requests:write on the mirror repositories."
            exit 1
          fi

          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true
          git config --global --unset-all credential.helper || true

          git remote add mirror "https://oauth2:${MIRROR_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push mirror mirror-pr-branch:"mirror/pr-${PR_NUMBER}" --force

      - name: Create or update mirror pull request
        if: steps.subtree.outputs.has_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          TARGET_REPO: ${{ matrix.target_repo }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          PACKAGE_PATH: ${{ matrix.package_path }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          SOURCE_PR_URL: ${{ needs.prepare.outputs.pr_url }}
          SOURCE_PR_TITLE: ${{ needs.prepare.outputs.pr_title }}
          SOURCE_PR_BODY: ${{ needs.prepare.outputs.pr_body }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mirror_branch="mirror/pr-${PR_NUMBER}"
          title="[Mirror] ${SOURCE_PR_TITLE} (#${PR_NUMBER})"
          body="$(cat <<EOF
          This draft pull request is automatically mirrored from the monorepo so users of this standalone package repository can see that work is in progress.

          Source of truth:
          - Monorepo PR: ${SOURCE_PR_URL}
          - Monorepo repo: ${SOURCE_REPO}
          - Package path: \`${PACKAGE_PATH}\`

          Important:
          - Do not open parallel code changes directly from this mirrored PR.
          - Do not rely on this repository as the source of truth while the monorepo PR is open.
          - This draft PR is updated automatically while the monorepo PR changes.
          EOF
          )"

          existing_number="$(gh pr list \
            --repo "$TARGET_REPO" \
            --state open \
            --head "$mirror_branch" \
            --base "$TARGET_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_number" ]; then
            gh pr edit "$existing_number" \
              --repo "$TARGET_REPO" \
              --title "$title" \
              --body "$body"
          else
            gh pr create \
              --repo "$TARGET_REPO" \
              --base "$TARGET_BRANCH" \
              --head "$mirror_branch" \
              --title "$title" \
              --body "$body" \
              --draft
          fi

      - name: Cleanup local branches
        if: always()
        run: |
          git branch -D mirror-pr-branch || true
          git branch -D mirror-pr-head || true

  mirror-close:
    name: Close mirror PR for ${{ matrix.workspace }}
    needs: prepare
    if: needs.prepare.outputs.has_packages == 'true' && github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        env:
          SECRET_GIT_USER_NAME: ${{ secrets.MIRROR_GIT_USER_NAME }}
          SECRET_GIT_USER_EMAIL: ${{ secrets.MIRROR_GIT_USER_EMAIL }}
        run: |
          git config user.name "${SECRET_GIT_USER_NAME:-runilib-bot}"
          git config user.email "${SECRET_GIT_USER_EMAIL:-bot@runilib.dev}"

      - name: Close mirror pull request
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          TARGET_REPO: ${{ matrix.target_repo }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          SOURCE_PR_URL: ${{ needs.prepare.outputs.pr_url }}
          PR_MERGED: ${{ needs.prepare.outputs.pr_merged }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::MIRROR_PUSH_TOKEN secret is empty."
            exit 1
          fi

          mirror_branch="mirror/pr-${PR_NUMBER}"

          existing_number="$(gh pr list \
            --repo "$TARGET_REPO" \
            --state open \
            --head "$mirror_branch" \
            --base "$TARGET_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_number" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              note="Closing because the source monorepo PR was merged: ${SOURCE_PR_URL}. The normal mirror-to-main workflow will sync the standalone repository branch."
            else
              note="Closing because the source monorepo PR was closed: ${SOURCE_PR_URL}."
            fi

            gh pr close "$existing_number" \
              --repo "$TARGET_REPO" \
              --comment "$note"
          fi

      - name: Delete mirror branch from target repository
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          TARGET_REPO: ${{ matrix.target_repo }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_PUSH_TOKEN:-}" ]; then
            echo "::error::MIRROR_PUSH_TOKEN secret is empty."
            exit 1
          fi

          viewer_permission="$(gh repo view "$TARGET_REPO" --json viewerPermission --jq '.viewerPermission' 2>/dev/null || true)"

          if [ -z "$viewer_permission" ] || [ "$viewer_permission" = "READ" ] || [ "$viewer_permission" = "TRIAGE" ]; then
            echo "::error::MIRROR_PUSH_TOKEN cannot delete branches in ${TARGET_REPO} (viewerPermission=${viewer_permission:-unknown})."
            echo "::error::Use a PAT or GitHub App installation token with write access to the mirror repositories."
            exit 1
          fi

          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true
          git config --global --unset-all credential.helper || true

          git remote add mirror "https://oauth2:${MIRROR_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push mirror --delete "mirror/pr-${PR_NUMBER}" || true
