name: Deploy React-FormBridge Docs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to deploy.
        required: false
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: react-formbridge-docs-vercel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'workflow_dispatch' && github.repository == 'runilib/runilib' && inputs.environment == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Validate Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS" || { echo "Missing VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS secret"; exit 1; }

      - name: Build package dependencies
        run: yarn build:packages

      - name: Validate docs
        run: |
          yarn workspace react-formbridge-docs check
          yarn workspace react-formbridge-docs typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "preview_url=${url}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'workflow_dispatch' && github.repository == 'runilib/runilib' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: react-formbridge-docs-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Validate Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS" || { echo "Missing VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS secret"; exit 1; }

      - name: Build package dependencies
        run: yarn build:packages

      - name: Validate docs
        run: |
          yarn workspace react-formbridge-docs check
          yarn workspace react-formbridge-docs typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT_FORMBRIDGE_DOCS }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
