name: Mirror package to standalone repo

on:
  workflow_call:
    inputs:
      package_path:
        required: true
        type: string
      target_repo:
        required: true
        type: string
      target_branch:
        required: false
        type: string
        default: main
      mirror_git_user_name:
        required: false
        type: string
        default: runilib-bot
      mirror_git_user_email:
        required: false
        type: string
        default: bot@runilib.dev
    secrets:
      mirror_push_token:
        required: true
      mirror_git_user_name_secret:
        required: false
      mirror_git_user_email_secret:
        required: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        env:
          DEFAULT_GIT_USER_NAME: ${{ inputs.mirror_git_user_name }}
          DEFAULT_GIT_USER_EMAIL: ${{ inputs.mirror_git_user_email }}
          SECRET_GIT_USER_NAME: ${{ secrets.mirror_git_user_name_secret }}
          SECRET_GIT_USER_EMAIL: ${{ secrets.mirror_git_user_email_secret }}
        run: |
          git_user_name="${SECRET_GIT_USER_NAME:-}"
          git_user_email="${SECRET_GIT_USER_EMAIL:-}"

          if [ -z "$git_user_name" ]; then
            git_user_name="$DEFAULT_GIT_USER_NAME"
          fi

          if [ -z "$git_user_email" ]; then
            git_user_email="$DEFAULT_GIT_USER_EMAIL"
          fi

          git config user.name "$git_user_name"
          git config user.email "$git_user_email"

      - name: Verify package path exists
        run: |
          test -d "${{ inputs.package_path }}"

      - name: Create subtree branch
        run: |
          git subtree split --prefix="${{ inputs.package_path }}" -b mirror-branch

      - name: Push subtree to mirror repository
        env:
          GH_TOKEN: ${{ secrets.mirror_push_token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MIRROR_PUSH_TOKEN: ${{ secrets.mirror_push_token }}
        run: |
          echo "Token length: ${#MIRROR_PUSH_TOKEN}"
          if [ -z "$MIRROR_PUSH_TOKEN" ]; then
            echo "::error::MIRROR_PUSH_TOKEN secret is empty"
            exit 1
          fi
          viewer_permission="$(gh repo view "$TARGET_REPO" --json viewerPermission --jq '.viewerPermission' 2>/dev/null || true)"
          if [ -z "$viewer_permission" ] || [ "$viewer_permission" = "READ" ] || [ "$viewer_permission" = "TRIAGE" ]; then
            echo "::error::MIRROR_PUSH_TOKEN cannot write to ${TARGET_REPO} (viewerPermission=${viewer_permission:-unknown})."
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true
          git config --global --unset-all credential.helper || true
          git remote add mirror "https://oauth2:${MIRROR_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push mirror mirror-branch:${TARGET_BRANCH} --force

      - name: Cleanup local branch
        if: always()
        run: |
          git branch -D mirror-branch || true
