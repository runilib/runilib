<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" rx="40" fill="#F8F5FF"/>
  <rect x="90" y="102" width="1260" height="696" rx="34" fill="#FFFFFF"/>
  <rect x="144" y="176" width="478" height="510" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="186" y="236" fill="#111827" font-size="32" font-family="Arial, sans-serif" font-weight="700">Password</text>
  <rect x="186" y="278" width="394" height="72" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="186" y="382" width="394" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="186" y="382" width="280" height="10" rx="5" fill="#7C3AED"/>
  <text x="186" y="428" fill="#6D28D9" font-size="22" font-family="Arial, sans-serif" font-weight="700">Strong enough</text>
  <text x="186" y="474" fill="#475569" font-size="20" font-family="Arial, sans-serif">- 8+ characters</text>
  <text x="186" y="508" fill="#475569" font-size="20" font-family="Arial, sans-serif">- uppercase and lowercase</text>
  <text x="186" y="542" fill="#475569" font-size="20" font-family="Arial, sans-serif">- number and special character</text>
  <rect x="720" y="176" width="540" height="510" rx="28" fill="#0F172A"/>
  <text x="764" y="236" fill="#FFFFFF" font-size="30" font-family="Arial, sans-serif" font-weight="700">Confirmation flow</text>
  <text x="764" y="294" fill="#C4B5FD" font-size="22" font-family="Arial, sans-serif">field.password().strong()</text>
  <text x="764" y="334" fill="#C4B5FD" font-size="22" font-family="Arial, sans-serif">field.password().sameAs('password')</text>
  <text x="764" y="392" fill="#E9D5FF" font-size="20" font-family="Arial, sans-serif">Strength bars and submit blocking stay in the schema.</text>
